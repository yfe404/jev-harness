name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed runtime files match TypeScript
        run: git diff --exit-code -- dist/
      - run: npm pack --dry-run
      - name: Smoke-test the packed tarball in an isolated install
        run: npm run smoke
        env:
          TYPESAFE_API_KEY: ''
          OPENROUTER_API_KEY: ''
          JH_REPLAY: ''
